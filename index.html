<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>하모니카 파형 연습기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #080c14; color: #f1f5f9; touch-action: manipulation; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .ads-placeholder { background: rgba(30, 41, 59, 0.4); border: 1px dashed rgba(148, 163, 184, 0.25); }
        .waveform-scroll-container::-webkit-scrollbar { height: 6px; }
        .waveform-scroll-container::-webkit-scrollbar-track { background: #020617; }
        .waveform-scroll-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 상단 헤더 -->
    <header class="w-full border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur">
        <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🎷</span>
                <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-teal-400 to-blue-500 bg-clip-text text-transparent">
                    하모니카 파형 연습기
                </h1>
            </div>
            <span class="text-[11px] px-2 py-0.5 rounded bg-teal-950 text-teal-300 border border-teal-800 font-medium">
                실시간 분석
            </span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-4 py-3 w-full space-y-3 flex-grow">

        <!-- 상단 애드센스 광고 영역 -->
        <div class="ads-placeholder w-full h-16 sm:h-20 rounded-xl flex items-center justify-between px-4 text-slate-500 text-xs">
            <span>[구글 애드센스 상단 광고 영역]</span>
            <span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded">광고</span>
        </div>

        <!-- 컨트롤 Card -->
        <div class="glass-card rounded-xl p-3.5 sm:p-5 space-y-3">

            <!-- 컨트롤 버튼 및 상태 디스플레이 -->
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                <div class="flex items-center space-x-2">
                    <div id="statusDot" class="w-3 h-3 rounded-full bg-slate-600"></div>
                    <div>
                        <div id="statusText" class="text-xs font-bold text-slate-300">대기 중</div>
                        <div id="timeText" class="text-[11px] font-mono text-slate-500">시간: 00:00</div>
                    </div>
                </div>

                <div class="flex items-center space-x-1.5 w-full sm:w-auto justify-end">
                    <button id="toggleMicBtn" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs transition-all">
                        <span id="btnText">측정 시작</span>
                    </button>
                    <button id="playBtn" disabled class="px-3 py-2 rounded-lg bg-slate-800 text-slate-500 font-bold text-xs border border-slate-700/60 opacity-50 cursor-not-allowed transition-all">
                        듣기
                    </button>
                    <button id="stopPlayBtn" disabled class="px-3 py-2 rounded-lg bg-slate-800 text-slate-500 font-bold text-xs border border-slate-700/60 opacity-50 cursor-not-allowed transition-all">
                        정지
                    </button>
                    <button id="resetBtn" class="px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs border border-slate-700 transition-all">
                        초기화
                    </button>
                </div>
            </div>

            <!-- 파형 트랙 영역 -->
            <div class="space-y-1">
                <div class="flex justify-between items-center text-[11px] font-mono text-slate-400 px-0.5">
                    <span>파형 스크롤 / 재생 시 커서 이동</span>
                    <span id="freqText" class="text-teal-400 font-semibold">대기</span>
                </div>

                <!-- 스크롤 컨테이너 -->
                <div id="scrollContainer" class="waveform-scroll-container relative w-full h-48 sm:h-56 bg-slate-950 rounded-lg overflow-x-auto overflow-y-hidden border border-slate-800 shadow-inner">
                    <canvas id="waveformCanvas" class="h-full block"></canvas>
                </div>
            </div>

            <!-- 요약 가이드 -->
            <div class="grid grid-cols-3 gap-2 pt-0.5 text-center text-[11px]">
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-2">
                    <div class="font-bold text-teal-400">단음</div>
                    <div class="text-slate-400 text-[10px]">매끄러운 띠</div>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-2">
                    <div class="font-bold text-blue-400">베이스</div>
                    <div class="text-slate-400 text-[10px]">수직 기둥</div>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-2">
                    <div class="font-bold text-purple-400">비브라토</div>
                    <div class="text-slate-400 text-[10px]">규칙적 물결</div>
                </div>
            </div>

        </div>

        <!-- 하단 애드센스 광고 영역 -->
        <div class="ads-placeholder w-full h-20 sm:h-24 rounded-xl flex items-center justify-between px-4 text-slate-500 text-xs">
            <span>[구글 애드센스 하단 광고 영역]</span>
            <span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded">광고</span>
        </div>

    </main>

    <footer class="w-full border-t border-slate-800 bg-slate-950 py-3 text-center text-[11px] text-slate-500">
        <p>© 2026 Harmonica Waveform Analyzer</p>
    </footer>

    <!-- 자바스크립트 엔진 -->
    <script>
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedAudioUrl = null;
        let audioPlayer = new Audio();

        let isListening = false;
        let isPlaying = false;
        let animationFrameId = null;
        let playbackAnimId = null;
        let startTime = 0;
        let timerInterval = null;

        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const playBtn = document.getElementById('playBtn');
        const stopPlayBtn = document.getElementById('stopPlayBtn');
        const resetBtn = document.getElementById('resetBtn');
        const btnText = document.getElementById('btnText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const timeText = document.getElementById('timeText');
        const freqText = document.getElementById('freqText');

        const scrollContainer = document.getElementById('scrollContainer');
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');

        let waveHistory = [];
        const xStep = 0.48; 
        const leftPadding = 40; 

        function resizeCanvas() {
            const minWidth = scrollContainer.clientWidth;
            const contentWidth = Math.max(minWidth, leftPadding + waveHistory.length * xStep + 100);
            canvas.width = contentWidth;
            canvas.height = scrollContainer.clientHeight;
            drawWaveform();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        toggleMicBtn.addEventListener('click', async () => {
            if (!isListening) {
                await startAudioProcessing();
            } else {
                stopAudioProcessing();
            }
        });

        // [듣기]
        playBtn.addEventListener('click', () => {
            if (recordedAudioUrl && !isPlaying) {
                audioPlayer.src = recordedAudioUrl;
                audioPlayer.play();
                isPlaying = true;
                statusText.textContent = "소리 재생 중";
                statusText.className = "text-xs font-bold text-blue-400";
                
                stopPlayBtn.disabled = false;
                stopPlayBtn.className = "px-3 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold text-xs shadow cursor-pointer transition-all";

                animatePlayback();
            }
        });

        // [정지] 버튼 클릭 시
        stopPlayBtn.addEventListener('click', () => {
            stopPlayback();
        });

        audioPlayer.onended = () => {
            stopPlayback();
        };

        function stopPlayback() {
            if (audioPlayer) audioPlayer.pause();
            isPlaying = false;
            if (playbackAnimId) cancelAnimationFrame(playbackAnimId);
            
            statusText.textContent = "일시정지됨";
            statusText.className = "text-xs font-bold text-slate-300";

            stopPlayBtn.disabled = true;
            stopPlayBtn.className = "px-3 py-2 rounded-lg bg-slate-800 text-slate-500 font-bold text-xs border border-slate-700/60 opacity-50 cursor-not-allowed transition-all";

            drawWaveform();
        }

        function animatePlayback() {
            if (!isPlaying) return;
            
            const duration = audioPlayer.duration || 1;
            const progress = audioPlayer.currentTime / duration;
            const totalWaveX = waveHistory.length * xStep;
            const currentX = leftPadding + (progress * totalWaveX);

            drawWaveform();

            // 붉은 막대 커서
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(currentX, 0);
            ctx.lineTo(currentX, canvas.height);
            ctx.stroke();

            scrollContainer.scrollLeft = currentX - (scrollContainer.clientWidth / 2);

            playbackAnimId = requestAnimationFrame(animatePlayback);
        }

        resetBtn.addEventListener('click', () => {
            stopAudioProcessing();
            stopPlayback();
            waveHistory = [];
            audioChunks = [];
            if (recordedAudioUrl) {
                URL.revokeObjectURL(recordedAudioUrl);
                recordedAudioUrl = null;
            }
            
            playBtn.disabled = true;
            playBtn.className = "px-3 py-2 rounded-lg bg-slate-800 text-slate-500 font-bold text-xs border border-slate-700/60 opacity-50 cursor-not-allowed transition-all";
            stopPlayBtn.disabled = true;
            stopPlayBtn.className = "px-3 py-2 rounded-lg bg-slate-800 text-slate-500 font-bold text-xs border border-slate-700/60 opacity-50 cursor-not-allowed transition-all";

            timeText.textContent = "시간: 00:00";
            freqText.textContent = "대기";
            canvas.width = scrollContainer.clientWidth;
            scrollContainer.scrollLeft = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        async function startAudioProcessing() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }, 
                    video: false 
                });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    recordedAudioUrl = URL.createObjectURL(audioBlob);
                    playBtn.disabled = false;
                    playBtn.className = "px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow cursor-pointer transition-all";
                };
                mediaRecorder.start();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.1;

                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                isListening = true;
                btnText.textContent = "측정 정지";
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                statusText.textContent = "기록 중";
                statusText.className = "text-xs font-bold text-emerald-400";

                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                scrollContainer.scrollLeft = 0;

                processAudio();
            } catch (err) {
                alert("마이크 권한 필요: " + err.message);
            }
        }

        function stopAudioProcessing() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (microphone && microphone.mediaStream) {
                microphone.mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioCtx) {
                audioCtx.close();
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            isListening = false;
            btnText.textContent = "측정 시작";
            statusDot.className = "w-3 h-3 rounded-full bg-slate-600";
            statusText.textContent = "일시정지됨";
            statusText.className = "text-xs font-bold text-slate-300";
        }

        function updateTimer() {
            const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const secs = String(elapsedSeconds % 60).padStart(2, '0');
            timeText.textContent = `시간: ${mins}:${secs}`;
        }

        function processAudio() {
            if (!isListening) return;

            const timeData = new Uint8Array(analyser.fftSize);
            const freqData = new Uint8Array(analyser.frequencyBinCount);
            
            analyser.getByteTimeDomainData(timeData);
            analyser.getByteFrequencyData(freqData);

            let minVal = 128;
            let maxVal = 128;
            for (let i = 0; i < timeData.length; i++) {
                if (timeData[i] < minVal) minVal = timeData[i];
                if (timeData[i] > maxVal) maxVal = timeData[i];
            }

            const ampRange = (maxVal - minVal) / 256;

            let maxFreqVal = 0;
            let maxFreqIdx = 0;
            for (let j = 0; j < freqData.length; j++) {
                if (freqData[j] > maxFreqVal) {
                    maxFreqVal = freqData[j];
                    maxFreqIdx = j;
                }
            }

            let fundamentalFreq = 0;
            if (maxFreqVal > 30) {
                fundamentalFreq = Math.round(maxFreqIdx * audioCtx.sampleRate / analyser.fftSize);
                freqText.textContent = `${fundamentalFreq} Hz`;
            } else {
                freqText.textContent = "대기";
            }

            let freqWeight = Math.min(1.4, Math.max(0.7, fundamentalFreq / 400));
            
            waveHistory.push({ 
                amp: ampRange,
                freq: fundamentalFreq,
                weight: freqWeight
            });

            const currentWaveX = leftPadding + (waveHistory.length * xStep);
            const requiredWidth = Math.max(scrollContainer.clientWidth, currentWaveX + 100);
            if (canvas.width !== requiredWidth) {
                canvas.width = requiredWidth;
            }

            drawWaveform();

            const rightThreshold = scrollContainer.clientWidth - 50;
            if (currentWaveX - scrollContainer.scrollLeft > rightThreshold) {
                scrollContainer.scrollLeft = currentWaveX - rightThreshold;
            }

            animationFrameId = requestAnimationFrame(processAudio);
        }

        function drawWaveform() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            if (waveHistory.length === 0) return;

            const centerY = canvas.height / 2;

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2dd4bf');
            gradient.addColorStop(0.5, '#3b82f6');
            gradient.addColorStop(1, '#a855f7');

            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#38bdf8';
            ctx.fillStyle = gradient;

            ctx.beginPath();
            
            for (let i = 0; i < waveHistory.length; i++) {
                const x = leftPadding + (i * xStep);
                const item = waveHistory[i];
                const h = (item.amp * canvas.height * item.weight) * 0.78;
                const y = centerY - (h / 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }

            for (let i = waveHistory.length - 1; i >= 0; i--) {
                const x = leftPadding + (i * xStep);
                const item = waveHistory[i];
                const h = (item.amp * canvas.height * item.weight) * 0.78;
                const y = centerY + (h / 2);
                ctx.lineTo(x, y);
            }

            ctx.closePath();
            ctx.globalAlpha = 0.8;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.stroke();
        }
    </script>
</body>
</html>
